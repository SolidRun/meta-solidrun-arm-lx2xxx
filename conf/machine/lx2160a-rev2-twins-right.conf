#@TYPE: Machine
#@NAME: SolidRun LX2160A Twins Dual (right)
#@SOC: LSCH3
#@DESCRIPTION: Machine configuration for SolidRun LX2160A 2.0 Twins Board in Dual Configuration, right side cpu

LX2160A_DDR_SPEED ?= "2900"

require conf/machine/include/lx216xa-solidrun.inc
require conf/machine/include/lx2160acex7-rev2.inc

# select DPL/DPC (config/lx2160a/LX2160A-<MC_FLAVOUR>/<DPL/DPC>)
# variable consumed in wks files
MC_DPC ?= "twins-s1_8-s2_9-dpc.dtb"
MC_DPL ?= "twins-s1_8-s2_9-dpl.dtb"

# select RCW
BOOTTYPE ?= "auto"
RCWAUTO ?= "twins/rcw_${LX2160A_CPU_SPEED}_${LX2160A_BUS_SPEED}_${LX2160A_DDR_SPEED}_8S_9_2_auto"

# configure ATF
ATF_DISABLE_S5 ?= "1"

# configure U-Boot
UBOOT_FDT ?= "fsl-lx2160a-twins-right"
UBOOT_FDT_FILE ?= "freescale/fsl-lx2160a-twins-right.dtb"
UBOOT_ETHPRIME ?= "DPMAC13@sgmii"
